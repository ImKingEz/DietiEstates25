<!DOCTYPE html>
<html>

<head>
    <title>OpenLayers Map - Select Point Only</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v7.5.1/ol.css">
    <style>
        html,
        body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        #confirmOverlay {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border: 1px solid #ccc;
            z-index: 1000;
        }

        #confirmButton {
            padding: 5px 10px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ol@v7.5.1/dist/ol.js"></script>
</head>

<body>
<div id="map"></div>
<script>
    console.log("OpenLayers loaded");

    var map;
    var marker;
    var selectedLongitude;
    var selectedLatitude;
    var targetZoom = 15; // Zoom desiderato al click
    var circle;  // Variabile per memorizzare il cerchio
    var circleLayer; // Layer per il cerchio
    var currentRadius; // Variabile per memorizzare il raggio corrente

    // Coordinate del centro dell'Italia (approssimative)
    var italyCenter = ol.proj.fromLonLat([12.5674, 41.8719]);

    function initMap() {
        map = new ol.Map({
            target: 'map',
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.OSM()
                })
            ],
            view: new ol.View({
                center: italyCenter,  // Centra sulla'Italia
                zoom: 6,             // Zoom per visualizzare l'intera Italia
                minZoom: 5,          // Zoom minimo consentito (opzionale)
                maxZoom: 18           // Zoom massimo consentito (opzionale)
            })
        });

        marker = new ol.layer.Vector({
            source: new ol.source.Vector(),
            style: new ol.style.Style({
                image: new ol.style.Circle({
                    radius: 7,
                    fill: new ol.style.Fill({
                        color: 'red'
                    }),
                    stroke: new ol.style.Stroke({
                        color: 'white',
                        width: 2
                    })
                })
            })
        });
        map.addLayer(marker);

        // Crea un layer vettoriale per il cerchio
        circleLayer = new ol.layer.Vector({
            source: new ol.source.Vector()
        });
        map.addLayer(circleLayer);

        // Listener per il click sulla mappa
        map.on('click', function(evt) {
            var coordinate = ol.proj.toLonLat(evt.coordinate);
            selectedLongitude = coordinate[0];
            selectedLatitude = coordinate[1];
            setMarker(selectedLongitude, selectedLatitude);
            zoomToLocation(selectedLongitude, selectedLatitude); //Zoom al click
            addConfirmationOverlay(); // Aggiungi l'overlay qui
        });
    }

    function setMarker(longitude, latitude) {
        var coordinate = ol.proj.fromLonLat([longitude, latitude]);

        marker.getSource().clear();

        var feature = new ol.Feature({
            geometry: new ol.geom.Point(coordinate)
        });

        marker.getSource().addFeature(feature);
    }

    function zoomToLocation(longitude, latitude) {
        var currentZoom = map.getView().getZoom(); // Ottieni lo zoom corrente
        var newZoom = targetZoom; // Imposta il target zoom

        map.getView().setCenter(ol.proj.fromLonLat([longitude, latitude]));
        map.getView().setZoom(newZoom);

    }

    function addConfirmationOverlay() {
        //Se esiste già un overlay di conferma, rimuovilo
        const existingOverlay = document.getElementById('confirmOverlay');
        if (existingOverlay) {
            existingOverlay.remove();
        }

        var element = document.createElement('div');
        element.id = 'confirmOverlay';
        element.style.position = 'absolute';
        element.style.top = '10px';
        element.style.left = '50%';
        element.style.transform = 'translateX(-50%)';
        element.style.backgroundColor = 'white';
        element.style.padding = '10px';
        element.style.border = '1px solid black';
        element.style.zIndex = '1000';


        var confirmButton = document.createElement('button');
        confirmButton.id = 'confirmButton';
        confirmButton.textContent = 'Conferma Posizione';

        confirmButton.addEventListener('click', function() {
            reverseGeocode(selectedLongitude, selectedLatitude);
            removeConfirmationOverlay(); // Rimuovi l'overlay dopo la conferma
        });

        element.appendChild(confirmButton);
        map.getTargetElement().appendChild(element);
    }

    function reverseGeocode(longitude, latitude) {
        var url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${latitude}&lon=${longitude}`;

        fetch(url)
            .then(response => response.json())
            .then(data => {
                if (data && data.address) {
                    var address = data.display_name;
                    sendDataToJava(address, latitude, longitude); //Passa tutti i dati necessari
                    drawCircle(latitude, longitude, currentRadius); // Disegna il cerchio qui
                } else {
                    sendDataToJava("Indirizzo non identificato per questo punto", latitude, longitude);
                }
            })
            .catch(error => {
                console.error("Errore nel reverse geocoding:", error);
                sendDataToJava("Errore di connessione", latitude, longitude);
            });
    }

    function sendDataToJava(address, latitude, longitude) {
        window.alert(address + "|" + latitude + "|" + longitude);
    }

    function drawCircle(latitude, longitude, radius) {
        // Converte le coordinate geografiche in coordinate della mappa
        var center = ol.proj.fromLonLat([longitude, latitude]);

        // Rimuovi il cerchio precedente, se esiste
        circleLayer.getSource().clear();

        // Crea una nuova feature Circle
        circle = new ol.Feature({
            geometry: new ol.geom.Circle(center, radius) // radius in meters
        });

        // Aggiungi la feature al layer del cerchio
        circleLayer.getSource().addFeature(circle);

        // Definisci lo stile del cerchio (opzionale)
        circle.setStyle(new ol.style.Style({
            fill: new ol.style.Fill({
                color: 'rgba(0, 0, 255, 0.1)' // Blu trasparente
            }),
            stroke: new ol.style.Stroke({
                color: 'blue',
                width: 1
            })
        }));
    }

    // Imposta il raggio iniziale dalla JavaFX application
    function setInitialRadius(radius) {
        currentRadius = radius;
    }

    // Aggiorna il raggio quando lo slider cambia
    function updateRadius(radius) {
        currentRadius = radius;
        // Ridraw the circle with the new radius if a location is already selected
        if (selectedLatitude && selectedLongitude) {
            drawCircle(selectedLatitude, selectedLongitude, currentRadius);
        }
    }


    window.onload = function() {
        initMap();
    };
</script>
</body>

</html>
